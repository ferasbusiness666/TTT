<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Tadele Teen Talks</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/ttt.css" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<meta name="robots" content="noindex" />
</head>
<!--
  404 — served by Cloudflare Pages for any path that doesn't match a file.
  Before this existed, unknown URLs returned the homepage with HTTP 200
  (finding #10), so crawlers indexed junk paths as if they were real pages.
  Uses the shared masthead/footer and ttt.css — no bespoke styling.
-->
<body data-screen-label="Not found">

  <header id="site-header" data-nav=""></header>

  <div class="page-head">
    <div class="crumbs"><a href="index.html">HOME</a> <span>›</span> <span>NOT FOUND</span></div>
    <span class="kicker">★ 404</span>
    <h1>THIS PAGE DOESN’T EXIST (YET)</h1>
    <p class="lede">The story you’re looking for isn’t here — maybe it hasn’t been written.</p>
    <div class="rule"></div>
    <div class="archive-more" style="justify-content:flex-start; padding-left:0;">
      <a class="btn" href="index.html">← BACK TO THE FRONT PAGE</a>
    </div>
  </div>

  <section class="newsletter" style="margin-top: var(--section-y);">
    <div class="nl-inner">
      <h2>STAY IN THE LOOP</h2>
      <p>New stories, videos, and gallery drops — straight to your inbox.</p>
      <form class="nl-form">
        <input type="email" placeholder="your@email.com" aria-label="Email address" required />
        <button type="submit">SUBSCRIBE</button>
      </form>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/ttt.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/ttt-auth.js"></script>
  <script src="assets/ttt-posts.js"></script>
  <script>
    // The 404 page carries the same newsletter strip as the rest of the
    // site, so it gets the same real wiring rather than a dead form.
    (function () {
      var c = window.tttAuth && window.tttAuth.client;
      if (c && window.tttPosts) {
        window.tttPosts.wireNewsletter(c, document.querySelector("form.nl-form"));
      }
    })();
  </script>

</body>
</html>
