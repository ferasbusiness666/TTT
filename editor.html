<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New post — Tadele Teen Talks</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/ttt.css" />
<script src="assets/ttt-upload.js"></script>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<!-- staff-only screen: hide until the auth guard confirms a session (no flash) -->
<script>document.documentElement.style.visibility = "hidden";</script>
</head>
<!--
  POST EDITOR — Medium-style composer
  ABOVE the body: title, category select, deck/subtitle, cover-image upload.
  BODY: a contentEditable canvas with two floating tools —
    • the "+" add menu (left of an empty line) → Image / Quote / Divider
    • the selection bubble toolbar → Bold / Italic / H2 / H3 / Quote / List / Link
  ALL images are chosen manually from the device and uploaded to Cloudinary
  (assets/ttt-upload.js); the post stores the hosted URL, not the file.
  There is deliberately NO stock/"unsplash" button.
-->
<body class="editor-page" data-screen-label="Post editor">

  <!-- top bar -->
  <div class="editor-top">
    <a class="back" href="admin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
      DASHBOARD
    </a>
    <span class="grow"></span>
    <span class="save-state" id="save-state">Draft · not saved</span>
    <button class="btn btn--ghost btn--sm" id="save-draft" type="button">SAVE DRAFT</button>
    <button class="btn btn--red btn--sm" id="publish" type="button">PUBLISH →</button>
  </div>

  <div class="editor-scroll">
    <div class="editor-canvas" style="position:relative;">

      <!-- meta: title / category / deck / cover -->
      <div class="editor-meta">
        <div class="editor-fieldrow">
          <select class="editor-select" id="cat-select" aria-label="Type">
            <option value="articles">ARTICLES</option>
            <option value="videos">VIDEOS &amp; BLOGS</option>
            <option value="artwork">ART &amp; PHOTOGRAPHY</option>
            <option value="magazines">MAGAZINES</option>
          </select>
          <select class="editor-select" id="category-select" aria-label="Category">
            <option value="">CATEGORY…</option>
            <!-- topical categories filled from the DB (loadCategories) -->
          </select>
          <button class="editor-cover-btn" id="cover-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="9" r="1.8"></circle><path d="M21 15l-5-5L5 21"></path></svg>
            ADD COVER PHOTO
          </button>
          <button class="editor-cover-btn" id="video-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
            ADD VIDEO LINK
          </button>
        </div>

        <!-- YouTube link (hidden until the button above is used) -->
        <div class="editor-fieldrow" id="video-wrap" style="display:none; margin-top:10px;">
          <input class="editor-select" id="video-url" type="url" style="flex:1; min-width:0; font-family:var(--font-sans); font-size:14px; letter-spacing:0;" placeholder="https://youtube.com/watch?v=…" />
          <span class="editor-cover-remove" id="video-remove">✕ Remove</span>
        </div>

        <textarea class="editor-title" id="title" rows="1" placeholder="Title" maxlength="120"></textarea>
        <textarea class="editor-deck" id="deck" rows="1" placeholder="Add a subtitle or deck…" maxlength="200"></textarea>
      </div>

      <!-- cover preview (hidden until a photo is chosen) -->
      <div class="editor-cover" id="cover-wrap" style="display:none;">
        <div class="media r-16-9"><img id="cover-img" alt="Cover" /></div>
        <span class="editor-cover-remove" id="cover-remove">✕ Remove cover</span>
      </div>

      <div class="editor-metaline">By Liya G. Tadele · will publish to the selected category</div>

      <!-- the writable body -->
      <div class="editor-body" id="body" contenteditable="true" spellcheck="true"
           data-placeholder="Tell your story… Select text for formatting, or click the + on an empty line to add a photo, quote or divider."></div>

      <!-- floating "+" add menu -->
      <div class="add-menu" id="add-menu">
        <button class="add-toggle" id="add-toggle" type="button" aria-label="Add block">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
        <div class="add-actions">
          <button type="button" data-add="image" title="Upload photo" aria-label="Upload photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="9" r="1.8"></circle><path d="M21 15l-5-5L5 21"></path></svg></button>
          <button type="button" data-add="quote" title="Quote" aria-label="Quote"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h5v6H8v-.5c0-1 .5-1.5 1.5-1.7V10H8V8h-1zm9 0h5v6h-4v-.5c0-1 .5-1.5 1.5-1.7V10H16V8h0z" opacity="0"></path><path d="M10 11H7.5c0-1.6.7-2.5 2.5-2.8V6.5C6.8 6.9 5 8.6 5 12v5.5h5V11zm9 0h-2.5c0-1.6.7-2.5 2.5-2.8V6.5c-3.2.4-5 2.1-5 5.5v5.5h5V11z"></path></svg></button>
          <button type="button" data-add="divider" title="Divider" aria-label="Divider"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16"></path><circle cx="12" cy="12" r="0.6" fill="currentColor"></circle></svg></button>
        </div>
      </div>

      <!-- selection bubble toolbar -->
      <div class="bubble" id="bubble">
        <button type="button" data-cmd="bold" title="Bold"><strong>B</strong></button>
        <button type="button" data-cmd="italic" title="Italic"><em>i</em></button>
        <span class="sep"></span>
        <button type="button" data-block="h2" title="Heading">H2</button>
        <button type="button" data-block="h3" title="Subheading">H3</button>
        <button type="button" data-block="blockquote" title="Quote">”</button>
        <button type="button" data-cmd="insertUnorderedList" title="List">•</button>
        <span class="sep"></span>
        <button type="button" data-cmd="createLink" title="Link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"></path></svg></button>
      </div>

      <!-- link dialog: text + URL, in the site's own styling -->
      <div class="link-pop" id="link-pop">
        <label for="link-text">TEXT</label>
        <input id="link-text" type="text" placeholder="What the link should say" />
        <label for="link-url">LINK URL</label>
        <input id="link-url" type="url" placeholder="https://example.com" />
        <div class="err" id="link-err"></div>
        <div class="row">
          <button class="btn btn--ghost btn--sm" id="link-cancel" type="button">CANCEL</button>
          <span class="grow"></span>
          <button class="btn btn--ghost btn--sm" id="link-remove" type="button" style="display:none;">REMOVE</button>
          <button class="btn btn--red btn--sm" id="link-apply" type="button">ADD LINK</button>
        </div>
      </div>

    </div>
  </div>

  <!-- hidden file inputs (manual upload only) -->
  <input type="file" id="cover-input" accept="image/*" hidden />
  <input type="file" id="body-input" accept="image/*" hidden />

  <script>
    try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) {}

    // Hosted cover URL (Cloudinary) — this, not the on-screen preview, is
    // what gets written to the post. `uploading` counts in-flight uploads so
    // a save can't race ahead of them and store a half-finished post.
    var coverUrl  = null;
    var uploading = 0;

    var body      = document.getElementById("body");
    var canvas    = document.querySelector(".editor-canvas");
    var addMenu   = document.getElementById("add-menu");
    var addToggle = document.getElementById("add-toggle");
    var bubble    = document.getElementById("bubble");
    var saveState = document.getElementById("save-state");

    /* ---------- auto-grow the title + deck textareas ---------- */
    function grow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
    ["title", "deck"].forEach(function (id) {
      var t = document.getElementById(id);
      grow(t);
      t.addEventListener("input", function () { grow(t); dirty(); });
      // Enter in the title jumps into the body
      if (id === "title") {
        t.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); document.getElementById("deck").focus(); }
        });
      }
    });

    /* ---------- cover photo (manual upload) ---------- */
    var coverInput = document.getElementById("cover-input");
    var coverBtn   = document.getElementById("cover-btn");
    var coverBtnHTML = coverBtn.innerHTML;

    document.getElementById("cover-btn").addEventListener("click", function () { coverInput.click(); });
    coverInput.addEventListener("change", function () {
      var f = coverInput.files && coverInput.files[0];
      if (!f) return;

      // Show the local file immediately so the editor feels responsive,
      // then swap in the hosted URL once Cloudinary has it. coverUrl (not
      // this preview) is what gets saved — a preview alone used to look
      // like it worked and then vanish on save.
      var reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById("cover-img").src = e.target.result;
        document.getElementById("cover-wrap").style.display = "";
      };
      reader.readAsDataURL(f);

      uploading++;
      coverBtn.disabled = true;
      window.tttUpload.upload(f, function (pct) {
        coverBtn.textContent = "UPLOADING " + pct + "%";
      }).then(function (res) {
        coverUrl = res.url;
        document.getElementById("cover-img").src = res.url;
        coverBtn.innerHTML = coverBtnHTML;
        coverBtn.disabled = false;
        uploading--;
        dirty();
        toast("Cover photo uploaded ★");
      }).catch(function (err) {
        // roll the preview back so the editor never shows a photo that
        // isn't actually saved anywhere
        coverUrl = null;
        document.getElementById("cover-wrap").style.display = "none";
        document.getElementById("cover-img").removeAttribute("src");
        coverInput.value = "";
        coverBtn.innerHTML = coverBtnHTML;
        coverBtn.disabled = false;
        uploading--;
        toast(err.message || "Couldn’t upload that image");
      });
    });
    /* ---------- YouTube link ---------- *
     * Videos are linked, never uploaded (Cloudinary video credits are
     * expensive; see 02-tech-stack-and-decisions.md). Stored in video_url. */
    var videoWrap  = document.getElementById("video-wrap");
    var videoInput = document.getElementById("video-url");
    document.getElementById("video-btn").addEventListener("click", function () {
      videoWrap.style.display = "";
      videoInput.focus();
    });
    document.getElementById("video-remove").addEventListener("click", function () {
      videoInput.value = "";
      videoWrap.style.display = "none";
      dirty();
    });
    videoInput.addEventListener("input", dirty);

    document.getElementById("cover-remove").addEventListener("click", function () {
      document.getElementById("cover-wrap").style.display = "none";
      document.getElementById("cover-img").removeAttribute("src");
      coverInput.value = "";
      coverUrl = null;
      dirty();
    });

    /* ---------- ensure the body always has a paragraph ---------- */
    function ensureParagraph() {
      if (!body.querySelector("p, h2, h3, blockquote, ul, ol, figure, hr")) {
        var p = document.createElement("p");
        p.innerHTML = "<br>";
        body.appendChild(p);
      }
    }
    body.addEventListener("focus", function () {
      ensureParagraph();
      if (!getSelection().rangeCount || !body.contains(getSelection().anchorNode)) {
        placeCaret(body.querySelector("p,h2,h3,blockquote,li") || body.firstChild, true);
      }
    });

    function placeCaret(node, atStart) {
      if (!node) return;
      var r = document.createRange();
      r.selectNodeContents(node);
      r.collapse(!!atStart);
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }

    /* ---------- find the block element the caret is in ---------- */
    function currentBlock() {
      var s = getSelection();
      if (!s.rangeCount) return null;
      var n = s.getRangeAt(0).startContainer;
      if (n.nodeType === 3) n = n.parentNode;
      while (n && n.parentNode !== body) n = n.parentNode;
      return (n && n.parentNode === body) ? n : null;
    }

    /* ---------- position the "+" add menu beside empty lines ---------- */
    function updateAddMenu() {
      var blk = currentBlock();
      var isEmpty = blk && blk.textContent.trim() === "" && blk.tagName !== "FIGURE" && blk.tagName !== "HR";
      if (!isEmpty || document.activeElement !== body) {
        if (!addMenu.classList.contains("open")) addMenu.style.display = "none";
        return;
      }
      var cRect = canvas.getBoundingClientRect();
      var bRect = blk.getBoundingClientRect();
      addMenu.style.display = "block";
      addMenu.style.top = (bRect.top - cRect.top + (bRect.height - 40) / 2) + "px";
      addMenu.style.left = (bRect.left - cRect.left - 52) + "px";
    }

    ["keyup", "click", "input"].forEach(function (ev) {
      body.addEventListener(ev, function () {
        if (!addMenu.contains(document.activeElement)) addMenu.classList.remove("open");
        updateAddMenu();
      });
    });
    body.addEventListener("input", dirty);

    addToggle.addEventListener("click", function (e) {
      e.preventDefault();
      addMenu.classList.toggle("open");
    });

    /* ---------- add-menu actions ---------- */
    var savedBlock = null;
    addMenu.querySelectorAll("[data-add]").forEach(function (btn) {
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); savedBlock = currentBlock(); });
      btn.addEventListener("click", function () {
        var kind = btn.getAttribute("data-add");
        addMenu.classList.remove("open");
        if (kind === "image") { document.getElementById("body-input").click(); }
        else if (kind === "quote") { insertBlock('<blockquote>Type a quote…</blockquote>'); }
        else if (kind === "divider") { insertBlock('<hr><p><br></p>'); }
      });
    });

    function insertBlock(html) {
      var ref = savedBlock || currentBlock();
      var frag = document.createElement("div");
      frag.innerHTML = html;
      var nodes = Array.prototype.slice.call(frag.childNodes);
      if (ref) {
        nodes.forEach(function (n) { ref.parentNode.insertBefore(n, ref.nextSibling); ref = n; });
        if (ref && (ref.textContent !== "" || ref.tagName === "P")) placeCaret(ref, true);
      } else {
        nodes.forEach(function (n) { body.appendChild(n); });
      }
      dirty(); updateAddMenu();
    }

    /* ---------- body image upload (manual) ---------- */
    var bodyInput = document.getElementById("body-input");
    bodyInput.addEventListener("change", function () {
      var f = bodyInput.files && bodyInput.files[0];
      if (!f) { return; }

      var problem = window.tttUpload.validate(f);
      if (problem) { toast(problem); bodyInput.value = ""; return; }

      // Insert the figure straight away with a local preview, then replace
      // the src with the hosted URL. Body images used to be saved as base64
      // data URLs inside the post HTML, which bloated every row in the
      // database and slowed the article page down; they're hosted now.
      var fig = document.createElement("figure");
      fig.innerHTML = '<img alt=""><figcaption>Add a caption (optional)</figcaption>';
      var img = fig.querySelector("img");
      var reader = new FileReader();
      reader.onload = function (e) { img.src = e.target.result; };
      reader.readAsDataURL(f);

      var ref = savedBlock || currentBlock();
      if (ref) { ref.parentNode.insertBefore(fig, ref.nextSibling); }
      else { body.appendChild(fig); }
      var p = document.createElement("p"); p.innerHTML = "<br>";
      fig.parentNode.insertBefore(p, fig.nextSibling);
      placeCaret(p, true);
      bodyInput.value = "";
      updateAddMenu();

      uploading++;
      img.style.opacity = "0.5";   // reads as "still working"
      window.tttUpload.upload(f).then(function (res) {
        img.src = res.url;
        img.style.opacity = "";
        uploading--;
        dirty();
      }).catch(function (err) {
        fig.remove();              // never leave an image that isn't hosted
        uploading--;
        toast(err.message || "Couldn’t upload that image");
      });
    });

    /* ---------- selection bubble toolbar ---------- */
    function updateBubble() {
      var s = getSelection();
      if (!s.rangeCount || s.isCollapsed || !body.contains(s.anchorNode)) { bubble.classList.remove("show"); return; }
      var rect = s.getRangeAt(0).getBoundingClientRect();
      if (!rect.width) { bubble.classList.remove("show"); return; }
      var cRect = canvas.getBoundingClientRect();
      bubble.classList.add("show");
      var bw = bubble.offsetWidth, bh = bubble.offsetHeight;
      var left = rect.left - cRect.left + rect.width / 2 - bw / 2;
      left = Math.max(6, Math.min(left, canvas.offsetWidth - bw - 6));
      bubble.style.left = left + "px";
      bubble.style.top = (rect.top - cRect.top - bh - 8) + "px";
      // reflect active inline states
      bubble.querySelector('[data-cmd="bold"]').classList.toggle("on", document.queryCommandState("bold"));
      bubble.querySelector('[data-cmd="italic"]').classList.toggle("on", document.queryCommandState("italic"));
    }
    document.addEventListener("selectionchange", function () {
      if (document.activeElement === body) updateBubble();
    });
    body.addEventListener("mouseup", updateBubble);
    body.addEventListener("keyup", updateBubble);

    bubble.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); }); // keep selection
      btn.addEventListener("click", function () {
        var cmd = btn.getAttribute("data-cmd");
        var block = btn.getAttribute("data-block");
        if (block) {
          var cur = currentBlock();
          var same = cur && cur.tagName && cur.tagName.toLowerCase() === block;
          document.execCommand("formatBlock", false, same ? "p" : block);
        } else if (cmd === "createLink") {
          openLinkPop();
          return;                       // the dialog finishes the job
        } else if (cmd) {
          document.execCommand(cmd, false, null);
        }
        updateBubble(); dirty();
      });
    });

    /* ---------- link dialog ------------------------------------------ *
     * Replaces the browser prompt(), which couldn't set the link's text
     * and looked nothing like the rest of the desk. Select some words →
     * click the link button → set TEXT + URL. Clicking an existing link
     * opens the same panel pre-filled, with a REMOVE option.            */
    var linkPop    = document.getElementById("link-pop");
    var linkText   = document.getElementById("link-text");
    var linkUrl    = document.getElementById("link-url");
    var linkErr    = document.getElementById("link-err");
    var linkApply  = document.getElementById("link-apply");
    var linkRemove = document.getElementById("link-remove");
    var savedRange = null;      // selection is lost once an input takes focus
    var editingAnchor = null;

    function anchorAtCaret() {
      var s = getSelection();
      if (!s.rangeCount) return null;
      var n = s.getRangeAt(0).startContainer;
      if (n.nodeType === 3) n = n.parentNode;
      while (n && n !== body) {
        if (n.tagName === "A") return n;
        n = n.parentNode;
      }
      return null;
    }

    /* Accept what people actually type ("example.com"), but never allow a
     * javascript:/data: URL — post bodies are rendered on the public
     * article page, so that would be a stored-XSS hole. */
    function normalizeUrl(raw) {
      var u = (raw || "").trim();
      if (!u) return null;
      if (/^\s*(javascript|data|vbscript):/i.test(u)) return null;
      if (/^(https?:\/\/|mailto:|\/|#)/i.test(u)) return u;
      return "https://" + u;
    }

    function showLinkErr(msg) { linkErr.textContent = msg; linkErr.classList.add("show"); }

    function openLinkPop() {
      var s = getSelection();
      savedRange = s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
      editingAnchor = anchorAtCaret();
      linkErr.classList.remove("show");

      if (editingAnchor) {
        linkText.value = editingAnchor.textContent;
        linkUrl.value  = editingAnchor.getAttribute("href") || "";
        linkRemove.style.display = "";
        linkApply.textContent = "UPDATE";
      } else {
        linkText.value = savedRange ? savedRange.toString() : "";
        linkUrl.value  = "";
        linkRemove.style.display = "none";
        linkApply.textContent = "ADD LINK";
      }

      bubble.classList.remove("show");
      linkPop.classList.add("show");

      // sit under the selection, clamped inside the canvas
      var cRect = canvas.getBoundingClientRect();
      var rect = (editingAnchor || (savedRange && savedRange.getBoundingClientRect().width)
                   ? (editingAnchor ? editingAnchor : savedRange)
                   : null);
      var r = rect ? rect.getBoundingClientRect() : null;
      if (r) {
        var left = r.left - cRect.left;
        left = Math.max(6, Math.min(left, canvas.offsetWidth - linkPop.offsetWidth - 6));
        linkPop.style.left = left + "px";
        linkPop.style.top  = (r.bottom - cRect.top + 10) + "px";
      }
      setTimeout(function () { (linkText.value ? linkUrl : linkText).focus(); }, 30);
    }

    function closeLinkPop() {
      linkPop.classList.remove("show");
      savedRange = null;
      editingAnchor = null;
    }

    function applyLink() {
      var url = normalizeUrl(linkUrl.value);
      if (!url) { showLinkErr("Enter a web address, like example.com"); linkUrl.focus(); return; }
      var text = linkText.value.trim();

      if (editingAnchor) {
        editingAnchor.setAttribute("href", url);
        editingAnchor.setAttribute("target", "_blank");
        editingAnchor.setAttribute("rel", "noopener noreferrer");
        if (text) editingAnchor.textContent = text;
        closeLinkPop(); dirty(); return;
      }

      body.focus();
      if (savedRange) {
        var sel = getSelection();
        sel.removeAllRanges(); sel.addRange(savedRange);
        if (!text) text = savedRange.toString() || url;
        var a = document.createElement("a");
        a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = text;
        savedRange.deleteContents();
        savedRange.insertNode(a);
        var after = document.createRange();
        after.setStartAfter(a); after.collapse(true);
        sel.removeAllRanges(); sel.addRange(after);
      }
      closeLinkPop(); dirty();
    }

    linkApply.addEventListener("click", applyLink);
    linkCancelWire();
    function linkCancelWire() {
      document.getElementById("link-cancel").addEventListener("click", function () {
        closeLinkPop(); body.focus();
      });
    }
    linkRemove.addEventListener("click", function () {
      if (editingAnchor) {
        var parent = editingAnchor.parentNode;
        while (editingAnchor.firstChild) parent.insertBefore(editingAnchor.firstChild, editingAnchor);
        parent.removeChild(editingAnchor);
        dirty();
      }
      closeLinkPop(); body.focus();
    });
    [linkText, linkUrl].forEach(function (input) {
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); applyLink(); }
        else if (e.key === "Escape") { e.preventDefault(); closeLinkPop(); body.focus(); }
      });
    });
    // clicking an existing link opens the panel to edit it
    body.addEventListener("click", function (e) {
      var a = e.target.closest ? e.target.closest("a") : null;
      if (a && body.contains(a)) { e.preventDefault(); openLinkPop(); }
    });
    // click anywhere else closes it
    document.addEventListener("mousedown", function (e) {
      if (linkPop.classList.contains("show") && !linkPop.contains(e.target) && !bubble.contains(e.target)) {
        closeLinkPop();
      }
    });

    /* ---------- dirty / save state ---------- */
    var t;
    function dirty() {
      saveState.textContent = "Draft · unsaved changes";
      clearTimeout(t);
      t = setTimeout(function () { saveState.textContent = "Draft · saved just now ✓"; }, 900);
    }
    // Save/Publish persist to the `posts` table. savePost() is defined in
    // the auth-aware block at the bottom (where the Supabase client lives).
    document.getElementById("save-draft").addEventListener("click", function () { savePost("draft"); });
    document.getElementById("publish").addEventListener("click", function () { savePost("published"); });

    /* ---------- tiny toast ---------- */
    function toast(msg) {
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);" +
        "background:var(--ttt-dark);color:var(--ttt-bg);font-family:var(--font-display);" +
        "letter-spacing:1px;font-size:16px;padding:11px 20px 9px;border-radius:100px;" +
        "border:1.5px solid var(--ttt-red);z-index:99;box-shadow:0 8px 24px rgba(26,15,5,.35);";
      document.body.appendChild(el);
      setTimeout(function () { el.style.transition = "opacity .3s"; el.style.opacity = "0"; }, 1500);
      setTimeout(function () { el.remove(); }, 1900);
    }

    // hide the add-menu when clicking away
    document.addEventListener("click", function (e) {
      if (!addMenu.contains(e.target) && e.target !== body) {
        if (!body.contains(e.target)) addMenu.classList.remove("open");
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/ttt-auth.js"></script>
  <script>
    // ---- persistence state -------------------------------------------
    var currentPostId = null;       // set when editing an existing post
    var currentPublishedAt = null;  // preserve the original publish date

    // The category dropdown mixes "type" options with a couple of topic
    // labels. Map it onto the schema's post_type (opinion/review are just
    // articles for now — a proper category picker is a later, design-gated
    // step). category_id stays null until that exists.
    var SELECT_TO_TYPE = { articles: "article", videos: "video", artwork: "artwork", magazines: "magazine", opinion: "article", review: "article" };
    var TYPE_TO_SELECT = { article: "articles", video: "videos", artwork: "artwork", magazine: "magazines" };

    function slugify(s) {
      return (s || "").toLowerCase().trim()
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "post";
    }

    var saving = false;  // single-flight guard so a click can't double-submit

    function savePost(status) {
      if (saving) return;
      if (uploading > 0) {
        toast("Hang on — a photo is still uploading");
        return;
      }
      var title = document.getElementById("title").value.trim();
      if (!title) { toast("Add a title before saving"); document.getElementById("title").focus(); return; }
      var client = window.tttAuth && window.tttAuth.client;
      if (!client) { toast("Not connected — try again in a moment"); return; }

      var saveBtn = document.getElementById("save-draft");
      var pubBtn  = document.getElementById("publish");
      var catEl   = document.getElementById("category-select");

      var fields = {
        title: title,
        excerpt: document.getElementById("deck").value.trim() || null,
        body: document.getElementById("body").innerHTML,
        post_type: SELECT_TO_TYPE[document.getElementById("cat-select").value] || "article",
        category_id: (catEl && catEl.value) ? parseInt(catEl.value, 10) : null,
        cover_image_url: coverUrl,
        video_url: (videoInput.value.trim() || null),
        status: status,
        updated_at: new Date().toISOString()
      };
      if (status === "published" && !currentPublishedAt) fields.published_at = new Date().toISOString();

      // Lock the flow: stop the "unsaved changes" timer from overwriting the
      // status text, and disable both buttons so one click does one thing.
      saving = true;
      clearTimeout(t);
      saveBtn.disabled = true;
      pubBtn.disabled = true;
      saveState.textContent = status === "published" ? "Publishing…" : "Saving…";

      function release() { saving = false; saveBtn.disabled = false; pubBtn.disabled = false; }

      window.tttAuth.getSession().then(function (res) {
        var session = res && res.data && res.data.session;
        var uid = session && session.user && session.user.id;
        if (currentPostId) {
          return client.from("posts").update(fields).eq("id", currentPostId).select("id, published_at").single();
        }
        fields.author_id = uid;
        fields.slug = slugify(title) + "-" + Date.now().toString(36).slice(-4);
        return client.from("posts").insert(fields).select("id, published_at").single();
      }).then(function (r) {
        if (!r) { release(); return; }
        if (r.error) { saveState.textContent = "Draft · not saved"; toast("Couldn’t save: " + r.error.message); release(); return; }
        if (r.data) { currentPostId = r.data.id; currentPublishedAt = r.data.published_at; }
        if (status === "published") {
          saveState.textContent = "Published ✓";
          toast("Published “" + title + "” ★");
          setTimeout(function () { window.location.href = "admin.html"; }, 800);
          // stay disabled through the redirect
        } else {
          saveState.textContent = "Draft · saved just now ✓";
          toast("Draft saved ★");
          release();
        }
      }).catch(function () {
        saveState.textContent = "Draft · not saved";
        toast("Couldn’t save — try again");
        release();
      });
    }

    // Fill the category dropdown from the DB (once, on load).
    function loadCategories() {
      var client = window.tttAuth && window.tttAuth.client;
      var sel = document.getElementById("category-select");
      if (!client || !sel) return Promise.resolve();
      return client.from("categories").select("id, name").order("name").then(function (r) {
        var rows = (r && r.data) || [];
        rows.forEach(function (c) {
          var o = document.createElement("option");
          o.value = c.id;
          o.textContent = String(c.name).toUpperCase();
          sel.appendChild(o);
        });
      });
    }

    // Load an existing post into the editor when opened as ?id=<postId>.
    function loadPostIntoEditor(id) {
      var client = window.tttAuth && window.tttAuth.client;
      if (!client) return;
      client.from("posts").select("*").eq("id", id).single().then(function (r) {
        if (r.error || !r.data) { toast("Couldn’t load that post"); return; }
        var p = r.data;
        currentPostId = p.id;
        currentPublishedAt = p.published_at;
        document.getElementById("title").value = p.title || "";
        document.getElementById("deck").value = p.excerpt || "";
        document.getElementById("body").innerHTML = p.body || "";
        document.getElementById("cat-select").value = TYPE_TO_SELECT[p.post_type] || "articles";
        document.getElementById("category-select").value = p.category_id ? String(p.category_id) : "";
        if (p.video_url) { videoInput.value = p.video_url; videoWrap.style.display = ""; }
        coverUrl = p.cover_image_url || null;
        if (coverUrl) {
          document.getElementById("cover-img").src = coverUrl;
          document.getElementById("cover-wrap").style.display = "";
        }
        grow(document.getElementById("title"));
        grow(document.getElementById("deck"));
        saveState.textContent = p.status === "published" ? "Published ✓" : "Draft · saved";
        document.title = "Edit · " + (p.title || "post") + " — Tadele Teen Talks";
      });
    }

    // Guard: only signed-in staff can open the editor. Page stays hidden
    // until this resolves; unauthenticated visitors go to the login screen.
    if (window.tttAuth && window.tttAuth.guard) {
      window.tttAuth.guard().then(function (ok) {
        if (!ok) return;
        if (window.tttAuth.currentProfile) {
          window.tttAuth.currentProfile().then(function (p) {
            if (!p) return;
            var line = document.querySelector(".editor-metaline");
            if (line) line.textContent = "By " + p.full_name + " · will publish to the selected category";
          });
        }
        // Categories must be in the dropdown before we try to select one.
        loadCategories().then(function () {
          var editId = new URLSearchParams(window.location.search).get("id");
          if (editId) loadPostIntoEditor(editId);
        });
      });
    } else {
      document.documentElement.style.visibility = "";
    }
  </script>
</body>
</html>
