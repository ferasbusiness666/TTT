<script>document.documentElement.style.visibility = "hidden";</script>
</head>
<!--
  ADMIN DASHBOARD
  Bespoke app layout (sidebar + topbar, no public masthead). Lists every
  post with status + actions (View / Edit → editor.html / Delete). The
  "CREATE POST" button opens the editor. Delete is a prototype (removes
  the row + updates the counts); a real build wires these to the CMS.
-->
<body class="admin" data-screen-label="Admin dashboard">

  <!-- ================= SIDEBAR ================= -->
  <aside class="admin-side">
    <div class="brandmark">
      <span class="dot">TTT</span>
      <span><b>TADELE</b><small>ADMIN DESK</small></span>
    </div>
    <nav class="admin-nav">
      <a class="is-active" id="nav-dash" href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Dashboard</span></a>
      <a href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg><span>Posts</span></a>
      <a id="nav-drafts" href="admin.html?view=drafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v5h5"></path><path d="M7 3h8l5 5v13H7z"></path><path d="M4 7v14h11" opacity="0"></path></svg><span>Drafts</span><span class="side-badge alt" id="draft-badge">5</span></a>
      <a href="editor.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg><span>New post</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="9" r="1.8"></circle><path d="M21 15l-5-5L5 21"></path></svg><span>Media</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg><span>Comments</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-2.82 1.17V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15H4.5a2 2 0 110-4h.09A1.65 1.65 0 006.26 9.4l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 0011 6.6h.01A1.65 1.65 0 0012 4.5V4.4a2 2 0 114 0v.09a1.65 1.65 0 001.51 1z"></path></svg><span>Settings</span></a>
    </nav>
    <div class="side-foot">
      <div class="admin-user">
        <span class="av">LT</span>
        <span class="nm">Liya G. Tadele<small>Editor-in-Chief</small></span>
      </div>
      <a class="admin-nav" id="logout" href="login.html" style="display:block; margin-top:6px;">
        <span style="display:flex; align-items:center; gap:11px; padding:10px 12px; opacity:.8; font-family:var(--font-sans); font-size:14px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px;"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg>
          <span>Log out</span>
        </span>
      </a>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="admin-main">
    <div class="admin-top">
      <h1>DASHBOARD</h1>
      <span class="grow"></span>
      <label class="adm-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        <input type="text" placeholder="search posts..." aria-label="Search posts" />
      </label>
      <a class="btn btn--red btn--sm" href="editor.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        CREATE POST
      </a>
    </div>

    <div class="admin-body">
      <!-- stats -->
      <div class="stats">
        <div class="stat-card c-peach"><div class="k">TOTAL POSTS</div><div class="v" id="s-total">24</div><div class="d">↑ 4 this month</div></div>
        <div class="stat-card c-mint"><div class="k">PUBLISHED</div><div class="v" id="s-pub">18</div><div class="d">live on site</div></div>
        <div class="stat-card c-blue"><div class="k">DRAFTS</div><div class="v" id="s-draft">5</div><div class="d">in progress</div></div>
        <div class="stat-card c-lavender"><div class="k">VIEWS · 30D</div><div class="v">12.4k</div><div class="d">↑ 22%</div></div>
      </div>

      <!-- posts -->
      <div class="admin-sec">
        <h2>ALL POSTS</h2>
        <span class="rule"></span>
      </div>

      <div class="table-wrap">
        <table class="posts">
          <thead>
            <tr>
              <th>Post</th>
              <th class="hide-sm">Category</th>
              <th class="hide-sm">Author</th>
              <th>Status</th>
              <th class="hide-sm">Date</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="posts-body">
            <!-- rows injected by script from the posts table (loadPosts) -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ---- real post list (Supabase) -----------------------------------
    // Rows are pulled live from the `posts` table (see loadPosts, called
    // from the auth block once a session is confirmed). Edit → editor.html,
    // View → the article page, toggle publishes/unpublishes, delete removes.
    var ROWS = [];

    var EYE  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    var EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg>';
    var TRASH= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"></path></svg>';
    var UP   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>';
    var BAN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>';

    function getParam(k) { return new URLSearchParams(window.location.search).get(k); }
    var VIEW = getParam("view"); // 'drafts' | null

    // Escapes quotes as well as angle brackets: these values go into HTML
    // ATTRIBUTES too, where a bare " would let a stored value break out and
    // add its own (see finding #3 in docs/09-security-stress-test.md).
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // post_type → the display label + card colour used by the mockup, so the
    // table looks identical whether the data is hardcoded or from the DB.
    var TYPE_LABEL = { article: "Articles", video: "Videos", artwork: "Artwork", magazine: "Magazines" };
    var TYPE_COLOR = { article: "var(--card-blue)", video: "var(--card-peach)", artwork: "var(--card-lavender)", magazine: "var(--card-yellow)" };
    function fmtDate(s) {
      if (!s) return "";
      var d = new Date(s);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function render() {
      var body = document.getElementById("posts-body");
      body.innerHTML = ROWS.map(function (p) {
        // Drafts view shows only unpublished posts
        if (VIEW === "drafts" && p.status === "published") return "";
        var type   = p.post_type || "article";
        var label  = TYPE_LABEL[type] || "Articles";
        var color  = TYPE_COLOR[type] || "var(--card-blue)";
        var author = (p.author && p.author.full_name) || "TTT Staff";
        var date   = fmtDate(p.published_at || p.created_at);
        var slug   = p.slug || "";
        var toggle = (p.status === "published")
          ? '<button class="icon-btn" data-toggle="' + p.id + '" title="Disable (unpublish)" aria-label="Disable">' + BAN + '</button>'
          : '<button class="icon-btn" data-toggle="' + p.id + '" title="Publish" aria-label="Publish">' + UP + '</button>';
        return '' +
        '<tr data-id="' + p.id + '">' +
          '<td><div class="post-cell">' +
            '<span class="thumb"><span class="media ph"></span></span>' +
            '<span class="tt">' + esc(p.title) + '<small>' + esc(p.excerpt) + '</small></span>' +
          '</div></td>' +
          '<td class="hide-sm"><span class="cat-chip" style="background:' + color + '">' + label.toUpperCase() + '</span></td>' +
          '<td class="hide-sm">' + esc(author) + '</td>' +
          '<td><span class="status ' + esc(p.status) + '">' + esc(String(p.status).toUpperCase()) + '</span></td>' +
          '<td class="hide-sm">' + date + '</td>' +
          '<td><div class="row-actions">' +
            '<a class="icon-btn" href="article.html?post=' + encodeURIComponent(slug) + '" title="View" aria-label="View">' + EYE + '</a>' +
            '<a class="icon-btn" href="editor.html?id=' + p.id + '" title="Edit" aria-label="Edit">' + EDIT + '</a>' +
            toggle +
            '<button class="icon-btn danger" data-del="' + p.id + '" title="Delete" aria-label="Delete">' + TRASH + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join("");
      updateCounts();
    }

    function updateCounts() {
      var pub   = ROWS.filter(function (p) { return p.status === "published"; }).length;
      var draft = ROWS.filter(function (p) { return p.status !== "published"; }).length;
      document.getElementById("s-total").textContent = ROWS.length;
      document.getElementById("s-pub").textContent   = pub;
      document.getElementById("s-draft").textContent = draft;
      document.getElementById("draft-badge").textContent = draft;
    }

    // Pull posts from the database (called after the auth guard passes).
    function loadPosts() {
      var client = window.tttAuth && window.tttAuth.client;
      if (!client) return;
      client.from("posts")
        .select("id, title, excerpt, slug, post_type, status, published_at, created_at, author:profiles(full_name)")
        .order("created_at", { ascending: false })
        .then(function (r) {
          ROWS = (r && r.data) || [];
          render();
        });
    }

    // toggle publish / disable (event delegation → update the DB, then reload)
    document.getElementById("posts-body").addEventListener("click", function (e) {
      var t = e.target.closest("[data-toggle]");
      if (!t) return;
      var id = +t.getAttribute("data-toggle");
      var row = ROWS.filter(function (p) { return p.id === id; })[0];
      if (!row) return;
      var client = window.tttAuth && window.tttAuth.client;
      if (!client) return;
      var next = row.status === "published" ? "draft" : "published";
      var patch = { status: next, updated_at: new Date().toISOString() };
      if (next === "published" && !row.published_at) patch.published_at = new Date().toISOString();
      t.disabled = true;
      client.from("posts").update(patch).eq("id", id).then(function (res) {
        if (res && res.error) { alert("Couldn’t update: " + res.error.message); t.disabled = false; return; }
        loadPosts();
      });
    });

    // delete (event delegation → delete from the DB, then reload)
    document.getElementById("posts-body").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-del]");
      if (!btn) return;
      var id = +btn.getAttribute("data-del");
      var row = ROWS.filter(function (p) { return p.id === id; })[0];
      if (!row) return;
      if (!confirm('Delete “' + row.title + '”? This cannot be undone.')) return;
      var client = window.tttAuth && window.tttAuth.client;
      if (!client) return;

      // Grab the post's images BEFORE deleting the row, otherwise there's
      // nothing left to tell us which Cloudinary files it owned — that's
      // how orphaned photos piled up before.
      client.from("posts").select("cover_image_url, body").eq("id", id).single().then(function (r) {
        var images = [];
        if (r && r.data) {
          if (r.data.cover_image_url) images.push(r.data.cover_image_url);
          if (window.tttUpload) images = images.concat(window.tttUpload.imageUrlsInHtml(r.data.body));
        }
        return client.from("posts").delete().eq("id", id).then(function (res) {
          if (res && res.error) { alert("Couldn’t delete: " + res.error.message); return; }
          // best-effort: the post is already gone either way, but say so
          // out loud if the photo couldn't be removed — silence here is why
          // orphaned images went unnoticed in the first place
          if (images.length && window.tttUpload) {
            window.tttUpload.deleteImages(images).then(function (out) {
              var results = (out && out.deleted) || [];
              var failed = results.filter(function (x) { return x.result !== "ok"; });
              console.log("[ttt] image cleanup:", out);
              if (!out) {
                alert("The post was deleted, but its photo couldn’t be removed from Cloudinary (no response from the cleanup service).");
              } else if (out.error) {
                alert("The post was deleted, but its photo couldn’t be removed:\n\n" + out.error);
              } else if (failed.length) {
                alert("The post was deleted, but its photo couldn’t be removed:\n\n" +
                      failed.map(function (x) { return x.publicId + ": " + x.result; }).join("\n"));
              }
            });
          }
          loadPosts();
        });
      });
    });

    // Drafts view: swap headings + active sidebar item
    if (VIEW === "drafts") {
      document.querySelector(".admin-top h1").textContent = "DRAFTS";
      document.querySelector(".admin-sec h2").textContent = "DRAFTS";
      document.title = "Drafts — Tadele Teen Talks";
      var d = document.getElementById("nav-dash"); if (d) d.classList.remove("is-active");
      var dr = document.getElementById("nav-drafts"); if (dr) dr.classList.add("is-active");
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/ttt-auth.js"></script>
  <script src="assets/ttt-upload.js"></script>
  <script>
    // Guard: only signed-in staff see the dashboard; everyone else is
    // sent to the login screen. The page stays hidden until this resolves.
    if (window.tttAuth && window.tttAuth.guard) {
      window.tttAuth.guard().then(function (ok) { if (ok) { showCurrentUser(); loadPosts(); } });
    } else {
      document.documentElement.style.visibility = "";
    }

    // Swap the mockup placeholder name/initials for the signed-in user's.
    function showCurrentUser() {
      if (!window.tttAuth.currentProfile) return;
      window.tttAuth.currentProfile().then(function (p) {
        if (!p) return;
        var nm = document.querySelector(".admin-user .nm");
        if (nm) {
          var small = nm.querySelector("small");   // keep the role subtitle
          nm.textContent = p.full_name;
          if (small) nm.appendChild(small);
        }
        var av = document.querySelector(".admin-user .av");
        if (av) av.textContent = userInitials(p.full_name);
      });
    }
    function userInitials(name) {
      if (!name) return "TTT";
      var base = name.indexOf("@") > -1 ? name.split("@")[0] : name;
      var parts = base.replace(/[^A-Za-z]+/g, " ").trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return base.slice(0, 2).toUpperCase();
    }

    // Log out → end the Supabase session, then back to login.
    (function () {
      var logout = document.getElementById("logout");
      if (!logout) return;
      logout.addEventListener("click", function (e) {
        e.preventDefault();
        var done = function () { window.location.replace("login.html"); };
        if (window.tttAuth && window.tttAuth.signOut) {
          window.tttAuth.signOut().then(done).catch(done);
        } else { done(); }
      });
    })();
  </script>
</body>
</html>
